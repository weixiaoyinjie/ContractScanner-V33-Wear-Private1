
name: Build V33.1 Phone and Wear APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          set -euo pipefail
          ZIP="ContractScanner_V33_1_WearOS_Sync_Alert_Source.zip"
          test -f "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          test -f source/settings.gradle
          test -f source/app/build.gradle
          test -f source/wear/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests
        working-directory: source
        run: |
          node tests/core.test.js
          node tests/minute.test.js
          node tests/quick-nav.test.js
          node tests/engine-v33.test.js
          node tests/ui-regression.test.js
          node tests/wear-link.test.js

      - name: Build phone and watch
        working-directory: source
        run: gradle --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: ContractScanner-V33-1-Phone-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: ContractScanner-V33-1-Wear-APK
          path: source/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
